<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta property="og:title" content="KGTS Selections 2026-27" />

  <meta property="og:type" content="website" />

  <title>KGTS Selections 2026-27</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      padding: 24px;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    h1 {
      font-size: clamp(1.3rem, 5.5vw, 2.75rem);
      font-weight: 800;
      margin-bottom: 48px;
      line-height: 1.2;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 18px 24px;
      background: #e11d48;
      color: #ffffff;
      text-decoration: none;
      font-size: clamp(1rem, 3.5vw, 1.15rem);
      font-weight: 600;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
    }

    .btn:active {
      transform: translateY(0);
    }
  </style>
</head>
